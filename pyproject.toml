[project]
name = "scraper"
version = "0.1.0"
description = "Universal Python scraper for public websites and public Telegram channels"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vladyslav Shokun", email = "sonoyumiii@gmail.com" }]
dependencies = [
    "httpx>=0.27,<0.28",
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.47,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "tenacity>=8.4,<9",
    "pyyaml>=6.0,<7",
    "python-dateutil>=2.9,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "aiolimiter>=1.1,<2",
    "structlog>=24.1,<25",
]

[project.urls]
Repository = "https://github.com/sonoyumi/async-content-scraper"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.21,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
scraper = "scraper.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
